# SEO Related
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# Site Author
author:
  name             : "Hongbo Zhao (赵宏博)"
  avatar           : "images/profile.jpg"
  bio              : "Ph.D Student"
  location         : "Beijing, China"
  employer         : "Institute of Automation, CAS"
  pubmed           :
  googlescholar    : "https://scholar.google.com/citations?user=Gs22F0UAAAAJ&hl=en"
  email            : "zhaohongbo2022@ia.ac.cn"
  researchgate     :
  uri              :
  bitbucket        :
