name: Update Google Scholar Stats

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Crawl Google Scholar
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python google_scholar_crawler/main.py

      - name: Push to google-scholar-stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan google-scholar-stats-temp
          git rm -rf . 2>/dev/null || true
          cp -r google-scholar-stats/* .
          git add gs_data.json gs_data_shieldsio.json

          git commit -m "Update Google Scholar stats $(date -u +%Y-%m-%d)"

          git branch -D google-scholar-stats 2>/dev/null || true
          git branch -m google-scholar-stats
          git push origin google-scholar-stats --force
